<!doctype html>
<meta charset="utf-8">
<title>Social Limiter options</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:420px;margin:32px auto;padding:0 16px}
  label{display:block;margin:16px 0 4px;font-weight:600}
  input{width:100%;padding:8px;font-size:16px;box-sizing:border-box}
  button{margin-top:20px;padding:10px 18px;font-size:16px}
  #msg{margin-left:10px;color:green}
  small{color:#666}
</style>
<h2>Social Limiter</h2>
<p><small>Limits are shared across twitter.com / x.com, tiktok.com and instagram.com.</small></p>
<label for="s">Session length (minutes)</label><input id="s" type="number" min="1">
<label for="c">Cooldown after a session (minutes)</label><input id="c" type="number" min="1">
<label for="d">Daily maximum (minutes)</label><input id="d" type="number" min="1">
<button id="save">Save</button><span id="msg"></span>
<script src="options.js"></script>
